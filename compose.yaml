name: series-viral-box-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture -d catalog"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  objectstore:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${OBJECTSTORE_PORT:-9000}:9000"
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  redis-data:
  object-data:
